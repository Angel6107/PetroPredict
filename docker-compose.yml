services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petro
      POSTGRES_PASSWORD: petro
      POSTGRES_DB: petropredict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://petro:petro@db:5432/petropredict
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
